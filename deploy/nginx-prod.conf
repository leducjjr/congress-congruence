# nginx site for the public site, uscongressvsvoters.org.
# Pages are served from /var/www/congress (scripts/publish_web.sh prod) and /api/ is passed to the
# same API as the dev site. www and the .com and .online names (with or without www) redirect to
# https://uscongressvsvoters.org. certbot adds the HTTPS parts (deploy/README.md, "Going public").

server {
    listen 80;
    listen [::]:80;
    server_name uscongressvsvoters.org;

    root /var/www/congress;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

    location / {
        try_files $uri $uri/ =404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name www.uscongressvsvoters.org
                uscongressvsvoters.com www.uscongressvsvoters.com
                uscongressvsvoters.online www.uscongressvsvoters.online;
    return 301 https://uscongressvsvoters.org$request_uri;
}
