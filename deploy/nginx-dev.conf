# nginx site for the password-protected dev copy.
# The panel pages are served from /var/www/congress-dev and /api/ is passed to
# the API on 127.0.0.1:8000. Replace dev.example.org with your dev host name
# (deploy/README.md does this with sed). certbot adds the HTTPS parts.

server {
    listen 80;
    listen [::]:80;
    server_name dev.example.org;

    root /var/www/congress-dev;
    index index.html;

    # Work in progress: only people with the dev password can see it.
    auth_basic "Dev site";
    auth_basic_user_file /etc/nginx/congress-dev.htpasswd;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        try_files $uri $uri/ =404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
