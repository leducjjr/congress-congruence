  # ---------------------------------------------------------------- November 2025: shutdown, ACA, Venezuela
  - survey: Granite State Poll, Nov 2025
    state: NH
    congress: 119
    respondents: 1402
    moe: 2.6
    design_effect: 2.2
    source:
      title: Granite State Poll, November 2025 (University of New Hampshire Survey Center)
      organization: UNH Survey Center
      asked: adults
      description: >-
        a University of New Hampshire poll of about 1,400 New Hampshire adults from a probability-based web
        panel, weighted to Census figures and 2024 results; statewide results only
      fielded: November 13 to 17, 2025
      dataset_url: https://scholars.unh.edu/cgi/viewcontent.cgi?article=1906&context=survey_center_polls
      about_url: *about
    items:
      UNH2511_DEAL:
        question: Support the deal to end the 2025 shutdown, funding the federal government through January 2026
        wording: >-
          The U.S. Senate has agreed to a deal to end the shutdown which provides funding for the federal
          government through January 2026. Generally speaking, do you support or oppose this deal to end the
          shutdown or do you not have an opinion on this?
        favor: 52      # strongly 26 + somewhat 26 (neutral 5, don't know 4)
        oppose: 39     # somewhat 14 + strongly 25
        url: https://scholars.unh.edu/cgi/viewcontent.cgi?article=1906&context=survey_center_polls
        votes: {senate: *shutdown_senate}
      UNH2511_ACA:
        question: Extend the Affordable Care Act (Obamacare) premium subsidies
        wording: >-
          Generally speaking, do you support or oppose Affordable Care Act (Obamacare) premium subsidies being
          extended or do you not have an opinion on this?
        favor: 50      # strongly 42 + somewhat 8 (neutral 3, don't know 6)
        oppose: 41     # somewhat 10 + strongly 31
        url: https://scholars.unh.edu/cgi/viewcontent.cgi?article=1906&context=survey_center_polls
        votes: {senate: *aca_senate}
      UNH2511_BOATS:
        question: Approve of the U.S. military destroying suspected drug-trafficking boats off the coast of Venezuela
        wording: >-
          Generally speaking, do you approve or disapprove of the U.S. military destroying boats off of the
          coast of Venezuela if it suspects they are involved in trafficking drugs into the United States or do
          you not have an opinion on this?
        favor: 42      # strongly 30 + somewhat 12 (neutral 4, don't know 4)
        oppose: 50     # somewhat 8 + strongly 42
        url: https://scholars.unh.edu/cgi/viewcontent.cgi?article=1906&context=survey_center_polls
        match: related
        note: >-
          Related, not the same: the poll asked about the boat strikes; the Senate voted on a war powers
          resolution that would have required Congress's approval for them.
        votes: {senate: *boats_senate}
      UNH2511_MADURO:
        question: Use the U.S. military to remove Venezuelan President Nicolás Maduro from office
        wording: >-
          Do you support or oppose using the U.S. military to remove Venezuelan President Nicholas Maduro from
          office or do you not have an opinion on this?
        favor: 15      # strongly 7 + somewhat 8 (neutral 15, don't know 7)
        oppose: 63     # somewhat 12 + strongly 51
        url: https://scholars.unh.edu/cgi/viewcontent.cgi?article=1906&context=survey_center_polls
        match: related
        note: >-
          Related, not the same: the poll asked about using the military to remove Maduro; the Senate voted on a
          war powers resolution that would have required Congress's approval for hostilities against Venezuela.
        votes: {senate: *venezuela_senate}

