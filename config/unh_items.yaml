# University of New Hampshire Survey Center polls (Granite State Poll, Pine Tree State Poll, Green
# Mountain State Poll, Bay State Poll): statewide published results for questions that a vote of the
# 119th Congress answers. Load with
#   python -m congress_congruence.ingest.statepolls link unh
#   python -m congress_congruence.ingest.statepolls load unh
#
# Each poll is a probability-based web panel of the state's adult residents (recruited by phone, text
# and mail), weighted to Census figures and the state's 2024 results. They ask all adults, not only
# registered voters, and report no registered-only figures (their "Undeclared/Not registered" group
# combines the two), so asked: adults. Figures are read from each release's statewide crosstab row
# (two answers on each side added together, as published); "neutral" and "don't know" are left out.
# The margins of error are "not adjusted for design effect", and each release gives the design effect,
# so ranges use MOE * sqrt(design effect): wider, never narrower than the poll supports.
#
# Statewide results are compared with senators, and with the House member only for Vermont (one
# at-large seat). Approved by John LeDuc, Nov 15, 2026. Releases are at
# https://scholars.unh.edu/survey_center_polls/ (PDF per poll, linked below).
#
# Vote rules (checked with `link` before loading):
#   OBBBA Senate passage: H.R. 1, July 1, 2025, 51-50 (Vice President breaking the tie)
#   OBBBA House final passage (concurring in the Senate's changes): July 3, 2025, 218-214
#   AI moratorium: Senate amendment to strike the 10-year ban on state AI rules, July 1, 2025, 99-1
#   Shutdown deal: Senate passage, Nov 10, 2025, 60-40
#   ACA subsidies: Senate vote on a 3-year extension, Dec 11, 2025, 51-48 (60 needed, so procedural:
#     related); House passage of a 3-year extension, Jan 8, 2026, 230-196
#   Boat strikes: Senate war powers resolution to bar hostilities against drug cartels, Oct 8, 2025, 48-51
#   Venezuela: Senate war powers resolution to bar hostilities against Venezuela, Nov 6, 2025, 49-51

organization: UNH Survey Center

about: &about https://cola.unh.edu/unh-survey-center

votes:
  obbba_senate: &obbba_senate          # as in tpp_items.yaml (the tie-break isn't in the tally)
    bill: [hr, 1]
    date: 2025-07-01
    questions: [Passage]
    note: The Senate's vote to pass the bill on July 1, 2025. It passed 51-50, with the Vice President breaking a tie.
  obbba_house: &obbba_house
    bill: [hr, 1]
    date: 2025-07-03
    expect: "218-214"
    note: The House's final vote on July 3, 2025, agreeing to the Senate's version, which sent the bill to the President.
  ai_strike: &ai_strike
    date: 2025-07-01
    expect: "99-1"
    support_side: nay
    note: >-
      The Senate voted 99-1 to strike the 10-year ban on state regulation of artificial intelligence from the
      bill. Voting No was the side that supports the ban.
  shutdown_senate: &shutdown_senate
    date: 2025-11-10
    expect: "60-40"
    note: The Senate's vote to pass the funding deal that ended the shutdown, November 10, 2025.
  aca_senate: &aca_senate
    date: 2025-12-11
    expect: "51-48"
    find: premium tax credit
    match: related
    note: >-
      The Senate's December 11, 2025 vote on a three-year extension of the enhanced premium tax credits. It
      got 51 votes but needed 60 to advance, so it's shown as a related vote.
  aca_house: &aca_house
    date: 2026-01-08
    expect: "230-196"
    note: The House's January 8, 2026 vote to pass a three-year extension of the enhanced premium tax credits.
  boats_senate: &boats_senate
    date: 2025-10-08
    expect: "48-51"
    support_side: nay
    note: >-
      A war powers resolution to bar U.S. hostilities against drug-trafficking groups without approval from
      Congress, aimed at the boat strikes. It failed 48-51. Voting No was the side that supports the strikes.
  venezuela_senate: &venezuela_senate
    date: 2025-11-06
    expect: "49-51"
    support_side: nay
    note: >-
      A war powers resolution to bar U.S. hostilities within or against Venezuela without approval from
      Congress. It failed 49-51. Voting No was the side that leaves military action open.

polls:
  # ---------------------------------------------------------------- June 2025: One Big Beautiful Bill
  - survey: Granite State Poll, Jun 2025
    state: NH
    congress: 119
    respondents: 1320
    moe: 2.7
    design_effect: 2.1
    source:
      title: Granite State Poll, June 2025 (University of New Hampshire Survey Center)
      organization: UNH Survey Center
      asked: adults
      description: >-
        a University of New Hampshire poll of about 1,300 New Hampshire adults from a probability-based web
        panel, weighted to Census figures and 2024 results; statewide results only
      fielded: June 19 to 23, 2025
      dataset_url: https://scholars.unh.edu/cgi/viewcontent.cgi?article=1875&context=survey_center_polls
      about_url: *about
    items:
      UNH2506_PASS:
        question: Want Congress to pass the "One Big Beautiful Bill Act"
        wording: >-
          Based on what you know now, do you want Congress to pass "One Big Beautiful Bill Act" or do you not
          have an opinion on this?
        favor: 33      # definitely 15 + probably 18 (neutral 6, don't know 4)
        oppose: 56     # probably not 8 + definitely not 48
        url: https://scholars.unh.edu/cgi/viewcontent.cgi?article=1875&context=survey_center_polls
        votes: {senate: *obbba_senate}
      UNH2506_AI:
        question: Ban state regulation of artificial intelligence (AI) for 10 years, as in the "One Big Beautiful Bill Act"
        wording: >-
          Generally speaking, do you support or oppose the following provisions in the "One Big Beautiful
          Bill Act" or do you not have an opinion on these issues? Bans state regulation of artificial
          intelligence (AI) for 10 years
        favor: 24      # strongly 8 + somewhat 16 (neutral 12, don't know 10)
        oppose: 54     # somewhat 13 + strongly 41
        url: https://scholars.unh.edu/cgi/viewcontent.cgi?article=1875&context=survey_center_polls
        votes: {senate: *ai_strike}

