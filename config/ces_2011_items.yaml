# CES 2011 questions about bills, all passed in the 110th or 111th Congress. Respondents'
# districts (112th Congress lines) are the same 2002 lines those Congresses used, so House votes
# are compared too. Answer codes: 1 = Support, 2 = Oppose. `ces link 2011` prints the matches.
#
# Columns: V101 = common content weight, V206 = state (FIPS), V276 = congressional district.
#
# CC341E and CC341F: the data file labels both "Don't Ask Don't Tell", but the questionnaire
# (cces.gov.harvard.edu/resource/cces2011commonpdf) shows CC341E is "End Don't Ask, Don't Tell" and
# CC341F is the Foreign Intelligence Surveillance Act ("allow U.S. spy agencies to eavesdrop on
# overseas terrorist suspects without first getting a court order"). Items A-D and G-H follow the
# questionnaire's order, so E and F are taken in its order too.

survey: CES 2011
weight_preference: [V101]
district_column: V276
district_congress: 112
district_lines_also: [110, 111]
state_column: V206

source:
  title: Cooperative Election Study 2011
  fielded: fall 2011
  dataset_url: https://doi.org/10.7910/DVN/GLRXZ0
  about_url: https://cces.gov.harvard.edu/

final_questions: &final
  - On Passage
  - Passage of the Bill
  - Suspend the Rules and Pass
  - Concur
  - Conference Report
  - Agreeing to the Resolution
  - Joint Resolution
  - Concurrent Resolution

items:
  CC341A:
    question: American Recovery and Reinvestment Act (the 2009 stimulus)
    votes:
      house:  {congress: 111, bill: [hr, 1], questions: [Conference Report]}
      senate: {congress: 111, bill: [hr, 1], questions: [Conference Report]}

  CC341B:
    question: Expand the State Children's Health Insurance Program (CHIP)
    votes:
      house:  {congress: 111, bill: [hr, 2], questions: *final}
      senate: {congress: 111, bill: [hr, 2], questions: *final}

  CC341C:
    question: American Clean Energy and Security Act (cap and trade)
    votes:
      house: {congress: 111, bill: [hr, 2454], questions: *final}

  CC341D:
    question: Health care reform (Affordable Care Act)
    votes:
      house:  {congress: 111, bill: [hr, 3590], questions: [Concur]}
      senate: {congress: 111, bill: [hr, 3590], questions: [Passage]}

  CC341E:
    question: End "Don't Ask, Don't Tell" (let gay people serve openly in the military)
    votes:
      house:  {congress: 111, bill: [hr, 2965], questions: [Concur]}
      # Voteview words this vote differently, so it's named by date and tally.
      senate:
        congress: 111
        date: 2010-12-18
        expect: "65-31"
        note: The Senate passed the repeal using an unrelated House bill as the vehicle, so the record's title doesn't match.

  CC341F:
    question: Allow eavesdropping on overseas terrorist suspects without a court order (FISA Amendments Act)
    votes:
      house:  {congress: 110, bill: [hr, 6304], questions: *final}
      senate: {congress: 110, bill: [hr, 6304], questions: *final}

  CC341G:
    question: Fund research using embryonic stem cells (Stem Cell Research Enhancement Act)
    votes:
      house:  {congress: 110, bill: [s, 5], questions: *final}
      senate: {congress: 110, bill: [s, 5], questions: *final}

  CC341H:
    question: The 2008 bank bailout (Troubled Asset Relief Program)
    votes:
      house:  {congress: 110, bill: [hr, 1424], questions: *final}
      senate: {congress: 110, bill: [hr, 1424], questions: *final}
